<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f3ee" />
    <meta name="description" content="大众点评 Redesign：用自然语言发现城市，用真实内容做出决定，和朋友一起把灵感变成出发。" />
    <link rel="icon" type="image/png" href="./dianping-official.png" />
    <title>大众点评 Redesign — 把城市，过成你的喜欢</title>
    <style>
      #root { min-height: 100vh; display: grid; place-items: center; background: #f5f3ee; }
      #root::before {
        content: '';
        width: 42px; height: 42px; border: 2px solid #e5e1d7; border-top-color: #ff6633;
        border-radius: 50%; animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #root.loaded::before { display: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
